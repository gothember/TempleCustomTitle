name: TempleTitles
version: 1.0.0
main: ru.templetitles.TempleTitles
api-version: 1.16
author: Jules
description: A plugin for custom titles using a token currency.
commands:
  customtitul:
    description: Allows players to request and manage their custom titles.
    usage: /customtitul
    permission: templetitles.use
    permission-message: You do not have permission to use this command.
  customtituls:
    description: Allows administrators to manage custom title requests.
    usage: /customtituls # Removed [give <игрок> <количество>]
    permission: templetitles.admin
    permission-message: You do not have permission to use this command.
  tokens:
    description: Allows administrators to give tokens to players.
    usage: /tokens give <player> <amount>
    permission: templetitles.tokens.give
    permission-message: You do not have permission to use this command.
  # New Commands for Title Ban Feature
  titleban:
    description: Bans a player from creating custom titles for a specified duration.
    usage: /titleban <player> <time>
    permission: templetitles.ban
    permission-message: "You do not have permission to use this command."
    aliases: [tban]
  titleunban:
    description: Unbans a player from creating custom titles.
    usage: /titleunban <player>
    permission: templetitles.unban
    permission-message: "You do not have permission to use this command."
    aliases: [tunban]
permissions:
  templetitles.use:
    description: Allows use of the /customtitul command.
    default: true
  templetitles.admin:
    description: Allows use of the /customtituls command for managing title requests.
    default: op
  templetitles.tokens.give: # New permission
    description: Allows giving tokens to players.
    default: op
  # New Permissions for Title Ban Feature
  templetitles.ban:
    description: Allows banning players from creating custom titles.
    default: op
  templetitles.unban:
    description: Allows unbanning players from creating custom titles.
    default: op
