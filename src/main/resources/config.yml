#--------------------------------------------------#
#         TempleTitles Plugin Configuration        #
#--------------------------------------------------#

#--------------------------------------------------#
# Messages & Text                                  #
#--------------------------------------------------#
# This section contains all user-facing messages.
# Most messages support color codes using '&'.
# Placeholders like %player%, %title%, %amount% are replaced dynamically.
messages:
  # Date and time format used throughout the plugin (e.g., for approval dates, submission timestamps).
  # Java SimpleDateFormat: https://docs.oracle.com/javase/8/docs/api/java/text/SimpleDateFormat.html
  time_format: "dd.MM.yyyy HH:mm"

  # Messages related to title status and interaction
  title_not_approved: "&cYour title '%title%' is not yet approved or has been rejected."
  request_submitted: "&aYour title request for '%title%' has been submitted for review."
  title_approved_player: "&aYour title '%title%' has been approved!"
  title_rejected_player: "&cYour title '%title%' has been rejected."

  # Messages related to the token economy
  # %required_tokens% - used in insufficient_tokens message
  insufficient_tokens: "&cYou do not have enough tokens. Required: %required_tokens%."
  # %amount% - the number of tokens
  tokens_received: "&aYou have received %amount% tokens."
  # %amount% - the number of tokens, %player% - the recipient's name
  tokens_sent: "&aYou have sent %amount% tokens to %player%."

  # General feedback messages
  # %player% - player name that was not found
  player_not_found: "&cPlayer %player% not found."

  # Sub-section for newer, more general messages
  general:
    player_only_command: "&cThis command can only be run by a player."
    permission_denied: "&cYou do not have permission to use this command."
    # Message shown to player when they need to type their desired title in chat
    # Hint: Default keywords are 'cancel', 'отмена', 'отменить', 'quit', 'exit'
    title_input_prompt: "&aPlease type your desired title in chat. (To cancel, type e.g., 'cancel' or 'отмена')"
    # %min_length% - minimum allowed title length
    title_input_too_short: "&cTitle must be at least %min_length% characters."
    # %max_length% - maximum allowed title length
    title_input_too_long: "&cTitle must be at most %max_length% characters."
    title_input_cancelled: "&eTitle request cancelled."
    # %title% - the title being equipped
    title_equipped: "&aTitle '%title%' equipped!"
    error_generic: "&cAn unexpected error occurred. Please contact an administrator."
    # Message for admins if they try to act on an already processed request in GUI
    admin_request_stale: "&cThis request seems to be outdated or already processed."
    # Feedback for admins after approving/rejecting a title. Placeholders: %title%, %player%
    admin_title_approved_feedback: "&aTitle '%title%' approved for player %player%."
    admin_title_rejected_feedback: "&cTitle '%title%' rejected for player %player%."
  # Message for when the admin review queue for titles is full
  max_pending_requests_reached: "&cSorry, the title request queue is currently full. Please try again later."
  # Title Ban Feature Messages
  # %admin_name% - Name of admin who applied ban. %duration% - Duration of ban.
  title_ban_applied_player: "&cАдминистратор %admin_name% запретил вам создавать титулы на %duration%."
  # %player_name% - Player who was banned. %duration% - Duration of ban.
  title_ban_applied_admin: "&aВы запретили игроку %player_name% создавать титулы на %duration%."
  # %expiry_date% - When the ban expires. %remaining_time% - Remaining duration.
  title_ban_attempt_while_banned: "&cВы не можете создавать титулы. Блокировка истекает %expiry_date% (еще %remaining_time%)."
  # %player_name% - Player checked.
  player_not_banned: "&eИгрок %player_name% не имеет активной блокировки на создание титулов."
  # %player_name% - Player unbanned.
  title_unban_success_admin: "&aВы успешно разблокировали игрока %player_name% от создания титулов."
  # %admin_name% - Admin who removed the ban.
  title_unban_notification_player: "&aАдминистратор %admin_name% снял с вас блокировку на создание титулов."
  invalid_time_format: "&cНеверный формат времени. Используйте, например: 30s, 10m, 1h, 7d."
  # %player_name% - Player who has never played.
  player_never_played: "&cИгрок %player_name% никогда не играл на сервере и не может быть заблокирован/разблокирован."
  usage_titleban: "&eИспользование: /titleban <игрок> <время> (например, 1d, 2h, 30m)"
  usage_titleunban: "&eИспользование: /titleunban <игрок>"

#--------------------------------------------------#
# LuckPerms Integration Settings                   #
#--------------------------------------------------#
luckperms:
  # Priority for the suffix set by this plugin. Higher numbers usually mean higher priority.
  # Consult LuckPerms documentation for how priorities work in your specific setup.
  suffix_priority: 100

#--------------------------------------------------#
# Title Properties & Rules                         #
#--------------------------------------------------#
title_properties:
  min_length: 3
  max_length: 30
  # Display text for different title statuses in GUIs or messages.
  status_approved_text: "&aApproved"
  status_rejected_text: "&cRejected"
  status_pending_text: "&ePending Review"
  # The cost in tokens to request a new custom title.
  title_request_cost: 1 # Changed from request_cost to title_request_cost
  # Keywords (case-insensitive) that a player can type in chat to cancel title input mode.
  cancel_keywords:
    - "cancel"
    - "отмена"
    - "отменить"
    - "quit"
    - "exit"
  validation:
    enable_pattern_validation: true
    # List of REGEX patterns. Titles matching any of these will be rejected.
    # Note: Color codes (&n, &#RRGGBB) typed by players are stored raw in the title.
    # If you want to disallow players from typing certain color codes, use patterns here.
    # Example: Disallow direct use of legacy color codes: "&[0-9a-fk-orA-FK-OR]"
    # Example: Disallow the word "admin" (case-insensitive): "(?i)admin"
    # Example: Disallow common script tags (very basic): "[<>]"
    forbidden_patterns:
      - "&[0-9a-fk-orA-FK-OR]" # Disallows player-typed legacy color codes
      # - "&#([A-Fa-f0-9]{6})" # Disallows player-typed HEX codes (Handled by Util.translateColors for display)
      - "(?i)admin"
      - "(?i)moderator"
      - "(?i)owner"
      - "(?i)staff"
    pattern_match_warning_message: "&cYour title contains forbidden characters or patterns."
  # Maximum number of titles allowed in the admin review queue at any given time.
  max_pending_requests: 100

#--------------------------------------------------#
# GUI (Graphical User Interface) Configurations    #
#--------------------------------------------------#
gui:
  # Configuration for the main player menu, accessed via /customtitul
  main_menu:
    title: "&5Custom Title Options"
    items:
      # Item for requesting a new title
      request_title:
        name: "&bRequest a New Title"
        # Lore for this item.
        # %cost% will be replaced by the value of title_properties.request_cost
        lore:
          - "&7Click to request a new custom title."
          - "&7Cost: %cost% Token(s)"
        # Special lore line added if the player doesn't have enough tokens (defined by title_properties.request_cost).
        no_tokens_lore: "&cYou do not have enough tokens for this!"
      # Item for viewing owned titles
      view_owned:
        name: "&aView Your Titles"
        lore:
          - "&7Click to view and manage your titles."
    # Decorative items for the main menu. Slot numbers are keys.
    # 'name' is optional, defaults to " ". Use '&' for color codes.
    # Ensure these slots do not conflict with functional items (20, 22).
    decorations:
      '0':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
      '1':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
      '2':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
      '3':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
      '4':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
      '5':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
      '6':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
      '7':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
      '8':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
      # Example of a different decoration for a specific slot:
      # '13':
      #   material: "RED_STAINED_GLASS_PANE"
      #   name: "&cDecorative Item"

  # Configuration for the GUI where players view their list of owned titles
  player_titles_view:
    title: "&3Your Titles"
    # This prefix is added before the actual title string for the item's display name.
    # Example: If prefix is "&f", an item for title "Cool" will be named "&fCool".
    item_name_prefix: "&f"
    # Lore configuration for each title item displayed in this GUI.
    # These are lists of strings; each string is a line of lore.
    # Available placeholders for all lore lines below:
    #   %titul_name% - The name of the title.
    #   %status% - The formatted status text (e.g., from title_properties.status_approved_text).
    #   %admin_name% - The name of the admin who approved the title (if applicable).
    #   %date% - The date of approval (formatted according to messages.time_format).
    item_lore:
      # Base lore - appears on every title item, typically at the top.
      base:
        - "&7&m------------------------"
        - "&7Title: %titul_name%" # Example of using placeholder in base
      # Status line - shows the current status of the title.
      status_line:
        - "&7Status: %status%"
      # Admin approver line - shows who approved the title. Only appears if an admin name is recorded.
      admin_line:
        - "&7Approved by: &6%admin_name%"
      # Approval date line - shows when the title was approved. Only appears if an approval date is recorded.
      date_line:
        - "&7Approved on: &e%date%"
      # Instruction on how to equip an approved title.
      equip_instruction:
        - "&7&m------------------------"
        - "&6Left-Click to equip this title."
      # Message shown if the title is not in a state where it can be equipped.
      not_approved_instruction:
        - "&7&m------------------------"
        - "&cThis title cannot be equipped."

  # Configuration for the admin GUI where they view and manage pending title requests (/customtituls)
  admin_requests_view:
    title: "&3Title Requests"
    # Item displayed if there are no pending requests.
    no_requests_item:
      name: "&cNo Active Requests"
      lore:
        - "&7There are currently no pending title requests."
    # Configuration for items representing each pending title request.
    request_item:
      # This prefix is added before the actual title string for the item's display name.
      name_prefix: "&bTitle: &f"
      # Lore for each pending request item.
      # Available placeholders:
      #   %player_name% - Name of the player who requested the title.
      #   %submission_date% - Date and time the request was submitted (formatted).
      #   %title_name% - The requested title name.
      lore:
        - "&7Requester: &e%player_name%"
        - "&7Submitted: &e%submission_date%"
        - "&7Title: &f%title_name%"
        - ""
        - "&aRight-Click to Approve"
        - "&cShift + Right-Click to Reject"

#--------------------------------------------------#
# Command Specific Messages                        #
#--------------------------------------------------#
commands:
  # Messages for the /tokens command
  tokens:
    usage: "&eUsage: /tokens give <player> <amount>"
    amount_positive: "&cAmount must be a positive integer."
    invalid_amount: "&cInvalid amount specified."
    unknown_subcommand: "&cUnknown sub-command. Usage: /tokens give <player> <amount>"
  # Usage messages for /customtitul and /customtituls can be added here if their
  # current simple behavior (no arguments needed for basic GUI opening) changes.

#--------------------------------------------------#
# Data Saving Settings                             #
#--------------------------------------------------#
saving:
  # Interval in minutes for automatically saving data (pending requests, player titles, tokens) to disk.
  # Set to 0 to disable auto-saving. Data will always be saved on server stop regardless of this setting.
  auto_save_interval_minutes: 5
